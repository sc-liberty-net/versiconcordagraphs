   event handlers below cannot be relied on for that, because some engines
   dispatch no focus events at all for SVG elements even while
   document.activeElement updates. Clicking is covered by the selection
   itself: .esel thickens the chosen arc. */

// Not generated — build_graph.py must not touch these.
const WA = {
  states:  {name:"The text says it", v:"--states"},
  supports:{name:"The text supports it", v:"--supports"},
  spec:    {name:"My speculation", v:"--spec"}
};
const TY = {
  lex:{name:"Shared wording", dash:""},
  ref:{name:"One cites the other", dash:"7 4"},
  con:{name:"Same idea", dash:"1.5 4"}
};

// The "by group" arrangement is HIDDEN, not removed. Everything behind it is
// still here and still runs — the relax() layout, each node's gx/gy, the group
// hint, setMode('group'). Flip this to true to put the control back.
const SHOW_GROUP_LENS = false;

const nodes = N.map(([id,ref,cl,gist,mod])=>({id,ref,cl,gist,mod,x:0,y:0,vx:0,vy:0}));
const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
const edges = E.map(([s,t,ty,wa,note])=>({s:byId[s],t:byId[t],ty,wa,note}));
const deg = {}; edges.forEach(e=>{deg[e.s.id]=(deg[e.s.id]||0)+1; deg[e.t.id]=(deg[e.t.id]||0)+1});

// Reference is identity: the same verse may appear once per module, each with
// its own cluster and its own summary. byRef groups those readings; with one
// module active every bucket holds exactly one node.
const byRef = {};
nodes.forEach(n=>{ (byRef[n.ref] = byRef[n.ref] || []).push(n); });
const activeMods = [...new Set(nodes.map(n=>n.mod))];

// The centre of the layout is a ROLE, not a cluster called "bridge". A module
// that names its hub something else still gets a centre; one that marks none
// gets a ring with nothing in the middle.
const HUB = Object.keys(CL).find(k=>CL[k].role==='hub') || null;

// The header states the corpus's size, so it is written from the generated
// counts rather than typed. It had drifted to "Eighty-nine passages ... in the
// New Testament" against 151 passages across 25 books, 46 of them Old
// Testament.
document.getElementById('hTitle').textContent = (MODS[MOD]||{}).title || 'Concordagraph';
document.getElementById('hSub').textContent =
  `${META.nodes} passages across ${META.books} books, joined by ${META.edges} connections — `
  + 'drawn from the NRSV and verified against a chapter-and-verse index. Every link names '
  + 'its kind and how much weight the text puts behind it. Click a passage, an arc or a '
  + 'book label to read what it connects to.';

// ---- layout: cluster anchors, then relax -----------------------------------
const order = Object.keys(CL);
const W=1180, H=880;
const anchors = {};
order.forEach((k,i)=>{
  const ang = (i/order.length)*Math.PI*2 - Math.PI/2;
  const rad = k===HUB ? 0 : 320;               // the hub cluster sits in the middle
  anchors[k] = {x: W/2 + Math.cos(ang)*rad*1.28, y: H/2 + Math.sin(ang)*rad};
});
nodes.forEach((n,i)=>{
  const a = anchors[n.cl];
  n.x = a.x + Math.cos(i*2.4)*70; n.y = a.y + Math.sin(i*2.4)*70;
});
function relax(steps){
  for(let s=0;s<steps;s++){
    for(let i=0;i<nodes.length;i++){
      const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){
        const b=nodes[j];
        let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy||0.01;
        if(d2<30000){
          const f=900/d2, d=Math.sqrt(d2);
          const fx=dx/d*f, fy=dy/d*f;
          a.vx-=fx; a.vy-=fy; b.vx+=fx; b.vy+=fy;
        }
      }
    }
    edges.forEach(e=>{
      const dx=e.t.x-e.s.x, dy=e.t.y-e.s.y, d=Math.hypot(dx,dy)||0.01;
      const f=(d-110)*0.012;
      e.s.vx+=dx/d*f; e.s.vy+=dy/d*f; e.t.vx-=dx/d*f; e.t.vy-=dy/d*f;
    });
    nodes.forEach(n=>{
      const a=anchors[n.cl];
      n.vx+=(a.x-n.x)*0.020; n.vy+=(a.y-n.y)*0.020;
      n.vx*=0.80; n.vy*=0.80;
      n.x+=n.vx; n.y+=n.vy;
    });
  }
}
relax(420);
nodes.forEach(n=>{ n.gx=n.x; n.gy=n.y; });

// ---- layout 2: canonical order along a baseline ----------------------------
// BOOKS and ABBR are GENERATED into the corpus block above, in the order the
// NRSV itself puts them, derived from the verse index. They used to be
// hardcoded here as eighteen books, which the corpus outgrew: seven cited
// books were absent, indexOf returned -1 for each, and their twelve nodes
// sorted ahead of Genesis with no tick or label on the axis. build_graph.py
// now refuses to write if a cited book cannot be placed.
const NT_FIRST = "Matthew";
nodes.forEach(n=>{
  const m = n.ref.match(/^((?:[1-4] )?[A-Za-z]+) (\d+):(\d+)$/);
  n.book = m[1]; n.chap = +m[2]; n.vers = +m[3];
  n.ord = BOOKS.indexOf(n.book);
});
const CANON_W = 2600;
const BASE_Y = 520, X0 = 70, X1 = CANON_W - 70;
const canon = nodes.slice().sort((a,b)=> a.ord-b.ord || a.chap-b.chap || a.vers-b.vers);
canon.forEach((n,i)=>{
  n.ax = X0 + (X1-X0) * (canon.length>1 ? i/(canon.length-1) : .5);
  n.ay = BASE_Y;
});
// Two arcs that share a stretch of baseline and sit at the same height trace
// the same curve. Walk the edges shortest-reach first and lift each one until
// its apex clears every arc it overlaps, so no two ever lie on top of another.
const ARC_BASE=44, ARC_K=0.55, ARC_STEP=14, ARC_GAP=11;
(function assignLanes(){
  const placed=[];
  edges.slice().sort((a,b)=>Math.abs(a.s.ax-a.t.ax)-Math.abs(b.s.ax-b.t.ax))
    .forEach(e=>{
      const lo=Math.min(e.s.ax,e.t.ax), hi=Math.max(e.s.ax,e.t.ax), span=hi-lo;
      let lane=0, apex;
      for(;lane<=40;lane++){
        apex=0.75*(ARC_BASE+span*ARC_K+lane*ARC_STEP);
        if(!placed.some(p=>!(hi<p.lo||lo>p.hi) && Math.abs(apex-p.apex)<ARC_GAP)) break;
      }
      e.lane=lane; placed.push({lo,hi,apex});
    });
})();
const arcH = e => ARC_BASE + Math.abs(e.s.ax-e.t.ax)*ARC_K + e.lane*ARC_STEP;
const MAX_APEX = Math.max(0, ...edges.map(e=>arcH(e)*0.75));

// ---- book axis, drawn only in canonical mode -------------------------------
const bookLabels = {};
// One stable focus object per book. Selection toggles by identity, so a fresh

const bookFocus = {};
(function buildAxis(){

// ---- placement -------------------------------------------------------------
let mode='canon';

function place(arcs){
  nodes.forEach(n=>{
    n.circle.setAttribute('cx',n.x); n.circle.setAttribute('cy',n.y);
    if(arcs){
      n.label.setAttribute('x',0); n.label.setAttribute('y',0);
      n.label.setAttribute('transform',`translate(${n.x},${n.y+n.r+7}) rotate(-90)`);
      n.label.setAttribute('text-anchor','end');
    } else {
      n.label.removeAttribute('transform'); n.label.removeAttribute('text-anchor');
      n.label.setAttribute('x',n.x+n.r+4); n.label.setAttribute('y',n.y+3.5);
    }
  });
  edges.forEach(e=>{
    let d;
    if(arcs){
      const [a,b] = e.s.x<=e.t.x ? [e.s,e.t] : [e.t,e.s];
      const hh = arcH(e);
      d = `M ${a.x} ${a.y} C ${a.x} ${a.y-hh}, ${b.x} ${b.y-hh}, ${b.x} ${b.y}`;
    } else {
      d = `M ${e.s.x} ${e.s.y} L ${e.t.x} ${e.t.y}`;
    }
    e.el.setAttribute('d',d);
    e.hit.setAttribute('d',d);          // the hit stroke tracks the drawn one
  });
}

const hint=document.getElementById('modeHint');
const HINTS={
  group:'Distance and angle mean nothing here — only which group a node belongs to, and its size, which tracks how many connections it has.',
  canon:'Left to right is the order of the books. An arc\u2019s width and height both track how far the connection reaches across the canon.'
};
function setMode(next){
  if(next==='group' && !SHOW_GROUP_LENS) return;   // hidden lens stays unreachable
  if(next===mode) return;
  mode=next;
  document.getElementById('mGroup').setAttribute('aria-pressed',String(mode==='group'));
  document.getElementById('mCanon').setAttribute('aria-pressed',String(mode==='canon'));
  hint.textContent=HINTS[mode];
  gAxis.style.display = mode==='canon' ? '' : 'none';
  const from=nodes.map(n=>({x:n.x,y:n.y}));
  const to=nodes.map(n=> mode==='canon' ? {x:n.ax,y:n.ay} : {x:n.gx,y:n.gy});
  const t0=performance.now(), dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:520;
  (function step(now){
    const k=dur? Math.min(1,(now-t0)/dur) : 1;
    const e=k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    nodes.forEach((n,i)=>{ n.x=from[i].x+(to[i].x-from[i].x)*e; n.y=from[i].y+(to[i].y-from[i].y)*e; });
    place(k===1 && mode==='canon');
    if(k<1) requestAnimationFrame(step); else fit();
  })(performance.now());
}
document.getElementById('mGroup').onclick=()=>setMode('group');
document.getElementById('mCanon').onclick=()=>setMode('canon');
if(!SHOW_GROUP_LENS) document.getElementById('mGroup').classList.add('hide');
hint.textContent=HINTS.canon;
nodes.forEach(n=>{ n.x=n.ax; n.y=n.ay; });
gAxis.style.display='';
place(true);

// ---- viewport --------------------------------------------------------------
let vx=0, vy=0, vs=1;
function apply(){ gRoot.setAttribute('transform',`translate(${vx},${vy}) scale(${vs})`); }
function fit(){
  const bb=gRoot.getBBox(), r=svg.getBoundingClientRect();
  vs=Math.min(r.width/(bb.width+90), r.height/(bb.height+90));
  vx=(r.width-bb.width*vs)/2-bb.x*vs; vy=(r.height-bb.height*vs)/2-bb.y*vs; apply();
}
window.addEventListener('resize',fit);
document.getElementById('zin').onclick=()=>{vs*=1.25;apply()};
document.getElementById('zout').onclick=()=>{vs/=1.25;apply()};
document.getElementById('zfit').onclick=fit;
// Panning must not call svg.setPointerCapture on pointerdown. Capturing the
// pointer retargets the following click to the <svg>, so a click on an arc or
// a book label never reaches that element's own handler — which is exactly how
// selecting them broke. Instead: remember where the press started, begin
// panning only once the pointer has actually moved, and track the drag on
// window so it survives leaving the SVG. A press that never moves stays a
// click; a press that does move pans, and its trailing click is swallowed.
const DRAG_SLOP = 4;
let panFrom=null, panning=false, swallowClick=false;
svg.addEventListener('pointerdown',e=>{
  if(e.target.closest('.node')) return;          // nodes are for selecting, not panning
  panFrom={x:e.clientX, y:e.clientY, vx, vy};
});
window.addEventListener('pointermove',e=>{
  if(!panFrom) return;
  if(!panning){
    if(Math.hypot(e.clientX-panFrom.x, e.clientY-panFrom.y) < DRAG_SLOP) return;
    panning=true; svg.classList.add('drag');
  }
  vx=panFrom.vx+(e.clientX-panFrom.x); vy=panFrom.vy+(e.clientY-panFrom.y); apply();
});
window.addEventListener('pointerup',()=>{
  if(panning) swallowClick=true;
  panFrom=null; panning=false; svg.classList.remove('drag');
});
svg.addEventListener('click',e=>{
  if(swallowClick){ swallowClick=false; e.stopPropagation(); e.preventDefault(); }
}, true);
svg.addEventListener('wheel',e=>{e.preventDefault();const k=e.deltaY<0?1.1:1/1.1;const r=svg.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top; vx=mx-(mx-vx)*k; vy=my-(my-vy)*k; vs*=k; apply();},{passive:false});

// ---- filters ---------------------------------------------------------------
const onCl=new Set(Object.keys(CL)), onWa=new Set(Object.keys(WA)), onTy=new Set(Object.keys(TY));
let query='', picked=null, hovered=null;

function build(host, map, set, kind){

    const lab=document.createElement('label'); lab.className='row'; lab.tabIndex=0;
    const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=true;
    const mark=document.createElement('span');
    if(kind==='cl'){ mark.className='dot'; mark.style.background=clCol(k); }
    else if(kind==='wa'){ mark.className='swatch'; mark.style.borderTopColor=`var(${o.v})`; }
    else { mark.className='swatch'; mark.style.borderTopColor='var(--ink-3)';
           if(o.dash) mark.style.borderTopStyle = o.dash==='7 4' ? 'dashed' : 'dotted'; }
    const txt=document.createElement('span'); txt.textContent=o.name;
    lab.append(cb,mark,txt);
    if(kind==='cl'){ const c=document.createElement('span'); c.className='count';
      c.textContent=nodes.filter(n=>n.cl===k).length; lab.append(c); }
    cb.addEventListener('change',()=>{cb.checked?set.add(k):set.delete(k);draw()});
    lab.addEventListener('keydown',e=>{if(e.key==='Enter'){cb.checked=!cb.checked;cb.dispatchEvent(new Event('change'));}});
    host.append(lab);
  });
}
build(document.getElementById('clusters'),CL,onCl,'cl');
build(document.getElementById('warrants'),WA,onWa,'wa');
build(document.getElementById('types'),TY,onTy,'ty');

document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();draw()});
document.getElementById('reset').onclick=()=>{
  document.querySelectorAll('.rail input[type=checkbox]').forEach(c=>{if(!c.checked){c.checked=true;c.dispatchEvent(new Event('change'))}});
  document.getElementById('q').value=''; query=''; picked=null; hovered=null;
  setMode('canon'); render(); draw(); fit();   // render() too, or the panel keeps the cleared selection
};

function matches(n){
  if(!onCl.has(n.cl)) return false;
  if(query && !(n.ref.toLowerCase().includes(query)||n.gist.toLowerCase().includes(query))) return false;
  return true;
}
// ---- focus: hover and selection share one treatment ------------------------
// A hover wins while it lasts, otherwise the click-selection stands. Pointing
// at something therefore previews exactly what selecting it would show.
function focused(){
  // While nothing is selected, hovering an ARC must not re-light the graph.
  // Sweeping the pointer across a dense arc field crosses dozens of 12px hit
  // strokes and the empty canvas between them, and every crossing was toggling
  // a full lit/dim pass over 151 nodes and 170 edges — which reads as flicker,
  // not as feedback. So arc hover only drives the highlight once there is a
  // selection to compare it against. The readout still names the arc either
  // way, so nothing becomes undiscoverable. Passages and book labels are
  // discrete targets and keep highlighting on hover as before.
  if(isEdge(hovered) && !picked) return null;
  return hovered || picked;
}

// A node lights itself and its neighbours; an arc lights its two ends; a book
// lights every passage in it, and theirs.
// A focus is a book ({kind:'book'}), an edge (has .s and .t) or a node. The
// kind tag is not decoration: nodes carry their own .book property, so testing
// f.book would read every node hover as a hover on its whole book.
const isBook = f => !!f && f.kind==='book';
const isEdge = f => !!f && !!f.s && !!f.t;

function litNodes(f){
  if(!f) return null;
  if(isBook(f)){
    const ids=new Set(nodes.filter(n=>n.book===f.book).map(n=>n.id));
    edges.forEach(e=>{ if(ids.has(e.s.id)||ids.has(e.t.id)){ ids.add(e.s.id); ids.add(e.t.id); } });
    return ids;
  }
  if(isEdge(f)) return new Set([f.s.id, f.t.id]);
  return new Set([f.id, ...edges.filter(e=>e.s===f||e.t===f)
                               .map(e=> e.s===f ? e.t.id : e.s.id)]);
}
function litEdge(e,f){
  if(!f) return true;
  if(isBook(f)) return e.s.book===f.book || e.t.book===f.book;
  if(isEdge(f)) return e===f;
  return e.s===f || e.t===f;
}
// The thing itself, as opposed to what it reaches — this gets the outline.
function isCore(n,f){
  if(!f) return false;
  if(isBook(f)) return n.book===f.book;
  if(isEdge(f)) return n===f.s || n===f.t;
  return n===f;
}

const readout=document.getElementById('readout');
function showReadout(f){
  if(!f){ readout.classList.remove('on'); readout.textContent=''; return; }
  let main, kind;
  if(isBook(f)){
    const c=nodes.filter(n=>n.book===f.book).length;
    main=f.book; kind=c===1 ? '1 passage' : c+' passages';
  } else if(isEdge(f)){
    main=`${f.s.ref}  →  ${f.t.ref}`;
    kind=`${TY[f.ty].name} · ${WA[f.wa].name}`;
  } else {
    main=f.ref; kind=CL[f.cl].name;
  }
  readout.textContent=main;
  const k=document.createElement('span'); k.className='rk'; k.textContent=kind;
  readout.append(k);
  readout.classList.add('on');
}
function hover(f){
  hovered=f; showReadout(f);
  // Do NOT re-append the hovered node to lift it above its neighbours. SVG has
  // no z-index, so that was the obvious way to raise the magnified label — but
  // detaching and re-inserting the group happens under the cursor, and the
  // browser then never synthesises the click at all: pointerdown, mousedown,
  // pointerup and mouseup all arrive on the circle and no click follows. That
  // is what stopped passages being selectable. The label's paper-coloured halo
  // (paint-order:stroke) keeps it readable over its neighbours instead, and the
  // readout below the spine carries the full reference regardless.
  draw();
}

function draw(){
  const f=focused(), near=litNodes(f);
  nodes.forEach(n=>{
    const ok=matches(n);
    n.el.classList.toggle('hide',!ok);
    n.el.classList.toggle('dim', ok && near ? !near.has(n.id) : false);
    n.el.classList.toggle('sel', isCore(n,picked));
    n.el.classList.toggle('lit', ok && isCore(n,f));
    // Magnified, the label spells the reference out; the spine is too crowded
    // to carry the full form at rest, which is the whole reason to magnify it.
    const mag = n===hovered;
    n.label.classList.toggle('mag', mag);
    const want = mag ? n.ref : n.abbr;
    if(n.label.textContent!==want) n.label.textContent=want;
  });
  edges.forEach(e=>{
    const ok = onWa.has(e.wa) && onTy.has(e.ty) && matches(e.s) && matches(e.t);
    e.el.classList.toggle('hide',!ok);
    e.hit.classList.toggle('hide',!ok);
    e.el.classList.toggle('dim', ok && f ? !litEdge(e,f) : false);
    e.el.classList.toggle('esel', e===picked);
  });
  for(const b in bookLabels){
    bookLabels[b].classList.toggle('mag', isBook(f) && f.book===b);
    bookLabels[b].classList.toggle('sel', isBook(picked) && picked.book===b);
  }
}

// ---- detail panel ----------------------------------------------------------
const panel=document.getElementById('panel');
// A passage, an arc or a book can all be selected, and all three toggle off
// when picked again. draw() already treats the three alike; the panel below
// is what differs.
function select(f){ picked = (picked===f ? null : f); render(); draw(); }

// Two links per reference, because they answer two different questions.
//
// The reference itself opens Bible Hub's VERSE page, which stacks every major
// translation of that one verse. That is the page you want when the question
// is what the English is doing — and in this corpus it often is: one Greek
// word can arrive as two English words (Matthew 17:25 and 22:17 are both
// κῆνσος, rendered "tribute" and "taxes"), and two Greek words can arrive as
// one (Matthew 22:17 and Romans 13:6 read alike in English and share no Greek
// at all). A single translation cannot show either.
//
// Beneath it, a link to the whole CHAPTER on Bible Gateway, for reading the
// verse in its context. Bible Gateway offers no way to scroll to or highlight
// one verse from a URL — its verse ids are opaque per-version numbers
// (en-NRSVUE-23888) and it does not style :target — so the chapter is the
// honest unit there. Note it no longer serves plain NRSV; NRSV redirects to
// NRSVUE.
//
// Bible Hub slugs are the book lowercased with spaces as underscores, with a
// few of its own spellings. Every book this corpus cites was checked against
// a live request; HUB holds the ones that differ.
const HUB = {'Psalm':'psalms', 'Song of Solomon':'songs'};
function hubSlug(book){ return HUB[book] || book.toLowerCase().replace(/ /g,'_'); }

function chapterLink(n){
  const a=document.createElement('a');
  a.href='https://biblehub.com/'+hubSlug(n.book)+'/'+n.chap+'-'+n.vers+'.htm';
  a.target='_blank'; a.rel='noopener noreferrer';
  a.textContent=n.ref;
  a.title=`${n.ref} on Bible Hub — every major translation of this verse, side by side`;
  const s=document.createElement('span'); s.className='ext'; s.textContent='compare ↗';
  const g=document.createElement('a'); g.className='chap';
  g.href='https://www.biblegateway.com/passage/?search='
        + encodeURIComponent(n.book+' '+n.chap) + '&version=NRSVUE';
  g.target='_blank'; g.rel='noopener noreferrer';
  g.textContent=`read ${n.book} ${n.chap} in full ↗`;
  g.title=`Open the whole of ${n.book} ${n.chap} on Bible Gateway (NRSVUE)`;
  return [a,s,g];
}
function linkRow(ref, meta, colourVar, onClick){
  const b=document.createElement('button'); b.className='link';
  const r=document.createElement('span'); r.className='lref'; r.textContent=ref;
  const m=document.createElement('span'); m.className='lmeta'; m.textContent=meta;
  if(colourVar) m.style.color=`var(${colourVar})`;
  b.append(r,m); b.onclick=onClick;
  return b;
}
function renderEmpty(){
  const p=document.createElement('p'); p.className='empty';
  p.textContent='Pick a passage, an arc or a book on the graph to see what it connects to and why.';
  const note=document.createElement('p'); note.className='note';
  note.textContent = window.NRSV
    ? 'Verse text is read from verses.js on this machine. Line color shows how much weight the text puts behind a link; line style shows what kind of link it is. Dotted grey lines are my own readings and carry no textual claim.'
    : 'This copy shows references and summaries. To read full verses here, run attach_verses.py against your own index and drop verses.js beside this file. Line color shows how much weight the text puts behind a link; line style shows what kind of link it is. Dotted grey lines are my own readings and carry no textual claim.';
  panel.append(p,note);
}

function renderNode(n){
  const h=document.createElement('p'); h.className='ref';
  h.append(...chapterLink(n));
  const tg=document.createElement('span'); tg.className='tag'; tg.textContent=CL[n.cl].name;
  panel.append(h,tg);
  const full = (window.NRSV||{})[n.ref];
  if(full){
    const q=document.createElement('blockquote'); q.className='verse'; q.textContent=full;
    const g2=document.createElement('p'); g2.className='gist-sm'; g2.textContent=n.gist;
    panel.append(q,g2);
  } else {
    const g=document.createElement('p'); g.className='gist'; g.textContent=n.gist;
    panel.append(g);
  }
  const mine=edges.filter(e=>e.s===n||e.t===n)
    .filter(e=>onWa.has(e.wa)&&onTy.has(e.ty));
  const h3=document.createElement('h3');
  h3.textContent = mine.length===1 ? '1 connection' : mine.length+' connections';
  panel.append(h3);
  mine.sort((a,b)=>['states','supports','spec'].indexOf(a.wa)-['states','supports','spec'].indexOf(b.wa));
  mine.forEach(e=>{
    const other = e.s===n ? e.t : e.s;
    panel.append(linkRow(other.ref,
      TY[e.ty].name+' · '+WA[e.wa].name + (e.note? ' — '+e.note : ''),
      WA[e.wa].v, ()=>select(e)));   // clicking a connection selects the ARC
  });
}

const JOIN = {lex:'shares wording with', ref:'cites', con:'connects to'};
function renderEdge(e){
  const h=document.createElement('p'); h.className='ref';
  h.append(...chapterLink(e.s));
  const ar=document.createElement('span'); ar.className='arrow'; ar.textContent=JOIN[e.ty];
  h.append(ar);
  h.append(...chapterLink(e.t));
  const tg=document.createElement('span'); tg.className='tag';
  tg.textContent = TY[e.ty].name+' · '+WA[e.wa].name;
  panel.append(h,tg);
  if(e.note){
    const g=document.createElement('p'); g.className='gist'; g.textContent=e.note;
    panel.append(g);
  }
  const h3=document.createElement('h3'); h3.textContent='Both ends'; panel.append(h3);
  [e.s,e.t].forEach(n=> panel.append(linkRow(n.ref, n.gist, null, ()=>select(n))));
}

function renderBook(f){
  const own = nodes.filter(n=>n.book===f.book).sort((a,b)=>a.chap-b.chap||a.vers-b.vers);
  const h=document.createElement('p'); h.className='ref'; h.textContent=f.book;
  const tg=document.createElement('span'); tg.className='tag';
  tg.textContent = own.length===1 ? '1 passage' : own.length+' passages';
  panel.append(h,tg);
  const h3=document.createElement('h3'); h3.textContent='Passages'; panel.append(h3);
  own.forEach(n=> panel.append(linkRow(n.ref, n.gist, null, ()=>select(n))));
}

function render(){
  panel.innerHTML='';
  if(!picked) return renderEmpty();
  if(isBook(picked)) return renderBook(picked);
  if(isEdge(picked)) return renderEdge(picked);
  renderNode(picked);
}
render(); draw();
requestAnimationFrame(fit);
</script>
</body>
</html>
